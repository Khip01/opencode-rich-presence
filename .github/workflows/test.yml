name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Allow manual trigger from the Actions tab for one-off runs.
  workflow_dispatch:

# Cancel in-progress runs when a new commit lands on the same
# branch. Without this, fast pushes to the same PR queue up
# redundant jobs that each install npm and run the full suite.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }} / Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        # The full range declared in `engines.node` (LTS lines 20 and
        # 22 plus the current latest 24) on Linux, where the daemon
        # speaks Unix domain sockets.
        #
        # Windows runs one job on Node 22. Its purpose is to exercise
        # the named-pipe code paths for real: isDaemonReady/IS_WINDOWS
        # in the win-path harness only ever execute there, and the
        # presence-toggle and phase2-v2 harnesses spawn a daemon and
        # bind an actual `\\.\pipe\...` address. The OS axis is what we
        # are paying for, so one Node version is enough to get it, and
        # a single job keeps the iteration loop short when it is red.
        #
        # phase1, phase2 and cli-lifecycle are skipped on Windows
        # because they hardcode /tmp paths and shell out to bash; see
        # the gated steps below.
        include:
          - os: ubuntu-latest
            node: 20
            suite: full
          - os: ubuntu-latest
            node: 22
            suite: full
          - os: ubuntu-latest
            node: 24
            suite: full
          - os: windows-latest
            node: 22
            suite: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Syntax check
        run: npm run syntax

      - name: Smoke (help / version / info / pack dry-run)
        run: |
          node bin/opencode-rpc.js help
          node bin/opencode-rpc.js version
          node bin/opencode-rpc.js info
          npm pack --dry-run

      # Pure-logic harnesses. No daemon and no filesystem layout
      # assumptions, so they are safe on every OS in the matrix.
      - name: Template selection harness
        run: npm run test:template-selection

      - name: Model name style harness
        run: npm run test:model-name-style

      - name: Replacements harness
        run: npm run test:replacements

      # Daemon liveness and IPC address shape. The IS_WINDOWS branches
      # only run on the Windows job, which is the reason that job
      # exists. Also guards against reintroducing the double
      # `\\.\pipe\` prefix and bare existsSync(DAEMON_SOCKET).
      - name: Win path harness
        run: npm run test:win-path

      # Migration + GC of the per-instance state snapshots. Pure
      # filesystem + PID liveness, no socket or shell dependency, so it
      # is safe on every OS in the matrix.
      - name: Presence GC harness
        run: npm run test:presence-gc

      # End-to-end CLI control against a live daemon. Proves the daemon
      # binds its IPC address (Unix socket on Linux, named pipe on
      # Windows) and that on/off/kill/spawn actually reach it.
      - name: Presence toggle harness
        run: npm run test:presence-toggle

      # V2 plugin entry against a live daemon with a mocked V2
      # context (no OpenCode v2 binary needed). Proves prompt push,
      # the bare model-id shape, and set-enabled forwarding/gating.
      - name: V2 entry harness
        run: npm run test:v2-entry

      - name: Phase 2 v2 harness
        run: npm run test:phase2-v2

      # Unix-only harnesses: hardcoded /tmp working paths and `bash -n`
      # over install.sh. Gated to Linux until they are ported.
      - name: Phase 1 harness
        if: matrix.suite == 'full'
        run: npm run test:phase1

      - name: Phase 2 harness
        if: matrix.suite == 'full'
        run: npm run test:phase2

      # CLI lifecycle (commit-time portion only): CLI output, arg
      # validation, install.sh unit checks, end-to-end install in
      # sandbox. The "update flow" scenario is in tests/release-smoke
      # and runs only in the release workflow.
      - name: CLI lifecycle harness
        if: matrix.suite == 'full'
        run: npm run test:cli-lifecycle
